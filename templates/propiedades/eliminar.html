{% extends 'base.html' %}
{% block title %}Eliminar propiedad | PNK{% endblock %}
{% block content %}
<section class="container py-5"><div class="row justify-content-center"><div class="col-lg-6"><div class="danger-panel text-center"><div class="danger-icon">!</div><span class="small-label">CONFIRMAR ACCIÓN</span><h1 class="fw-bold mt-2">¿Eliminar propiedad?</h1><p class="text-muted">Se eliminará <strong>{{ propiedad.titulo }}</strong> de la base de datos.</p><form method="post" class="d-flex justify-content-center gap-2 mt-4">{% csrf_token %}<button class="btn btn-danger btn-lg">Sí, eliminar</button><a class="btn btn-outline-secondary btn-lg" href="{% url 'panel' %}">Cancelar</a></form></div></div></div></section>
{% endblock %}
